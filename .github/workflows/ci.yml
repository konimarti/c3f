name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  C3C_RELEASE: v0.8.5_1
  C3L_RELEASE: v2.1.0

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux-x64, c3c: c3-linux.tar.gz, c3l: c3l-linux-x64.tar.gz }
          - { os: macos-14, target: macos-aarch64, c3c: c3-macos.zip, c3l: c3l-macos-aarch64.tar.gz }
          - { os: windows-2022, target: windows-x64, c3c: c3-windows.zip, c3l: c3l-windows-x64.zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install c3c and c3l
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download "$C3C_RELEASE" -R c3lang/c3c -p '${{ matrix.c3c }}'
          gh release download "$C3L_RELEASE" -R konimarti/c3l -p '${{ matrix.c3l }}'
          for archive in '${{ matrix.c3c }}' '${{ matrix.c3l }}'; do
            case "$archive" in
              *.tar.gz) tar xzf "$archive" ;;
              *) if [ "$RUNNER_OS" = Windows ]; then 7z x -y -bd "$archive" >/dev/null; else unzip -q "$archive"; fi ;;
            esac
          done
          echo "$RUNNER_TEMP/c3" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/c3l-${{ matrix.target }}" >> "$GITHUB_PATH"

      - name: Dependencies (c3l.lock)
        run: c3l sync --frozen

      # a single executable on Windows, with the C runtime linked in
      - name: Build
        run: if [ "$RUNNER_OS" = Windows ]; then c3c build c3f --wincrt=static; else c3c build c3f; fi

      - name: Unit tests
        run: c3c test

      - name: c3f's own sources are formatted
        run: build/c3f --check src test tools

      # the standard library of the c3c release: formatted with nothing kept as written
      # (exit 0, not 3), and a second run changes nothing
      - name: Format the C3 standard library
        run: |
          cp -r "$RUNNER_TEMP/c3/lib/std" "$RUNNER_TEMP/std"
          build/c3f -w "$RUNNER_TEMP/std"
          build/c3f --check "$RUNNER_TEMP/std"

      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "c3f ${GITHUB_REF_NAME#v}" = "$(build/c3f --version | tr -d '\r')"

      - name: Package
        run: |
          dir=c3f-${{ matrix.target }}
          mkdir "$dir"
          cp README.md LICENSE "$dir"/
          if [ "$RUNNER_OS" = Windows ]; then
            cp build/c3f.exe "$dir"/
            7z a -bd "$dir.zip" "$dir" >/dev/null
          else
            cp build/c3f "$dir"/
            tar czf "$dir.tar.gz" "$dir"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: c3f-${{ matrix.target }}
          path: c3f-${{ matrix.target }}.*

  # every style on the standard library and c3c's unit tests of the same release: formatted with
  # nothing kept as written, a second run changes nothing, and the tests (slow ones included) pass
  styles:
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: stdlib, args: '' }
          - { name: knr, args: '--set c3f_style=knr' }
          - { name: strict, args: '--set c3f_style=strict' }
          - { name: linux, args: '--set c3f_brace_style=linux' }
          - { name: aligned, args: '--set c3f_align=decls --set c3f_align_comments=always' }
          - { name: sorted-imports, args: '--set c3f_sort_imports=all' }
          - { name: wrap-long-100, args: '--set max_line_length=100 --set c3f_line_breaks=long' }
          - { name: strict-fit-80, args: '--set c3f_style=strict --set max_line_length=80 --set c3f_line_breaks=fit' }
          - { name: align-wrap-60, args: '--set c3f_continuation=align --set max_line_length=60 --set c3f_line_breaks=long' }
    name: style ${{ matrix.name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: c3f-linux-x64

      - name: Install c3c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar xzf c3f-linux-x64.tar.gz
          echo "$PWD/c3f-linux-x64" >> "$GITHUB_PATH"
          cd "$RUNNER_TEMP"
          gh release download "$C3C_RELEASE" -R c3lang/c3c -p c3-linux.tar.gz
          tar xzf c3-linux.tar.gz
          echo "$RUNNER_TEMP/c3" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          repository: c3lang/c3c
          ref: ${{ env.C3C_RELEASE }}
          path: c3c
          sparse-checkout: |
            lib
            test/unit

      - name: Format
        run: |
          rm -f c3c/.editorconfig    # only the options under test
          c3f -w ${{ matrix.args }} c3c/lib/std c3c/test/unit
          c3f --check ${{ matrix.args }} c3c/lib/std c3c/test/unit

      - name: c3c's unit tests on the formatted code
        run: cd c3c/test && c3c compile-test unit -O1 -D SLOW_TESTS -D RUN_PROCESS_TESTS --stdlib ../lib/std

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, styles]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum c3f-*.tar.gz c3f-*.zip > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --generate-notes c3f-*.tar.gz c3f-*.zip SHA256SUMS
